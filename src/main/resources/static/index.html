<!DOCTYPE html>
<html>

<head>
  <title>Chess</title>

  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>

  <link rel="icon" href="static/img/other/bluebetafish.png" type="image/x-icon">
  <title>CHESS</title>

  <!-- bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

  <!-- for chessboardjs -->
  <link rel="stylesheet" href="static/css/chessboardjs/chessboard-1.0.0.css">

  <!-- for webpage -->
  <link rel="stylesheet" href="static/css/chessboardjs/homepage.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <img class="img-fluid" src="static/img/other/bluebetafish.png" style="width: 55px;">

      <a  class="navbar-brand"><strong style="letter-spacing: 2px; color: rgba(255,255,255, 0.9)">BlueBetaFish</strong></a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navmenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a href="https://github.com/BlueBetaFish/chess-engine" class="nav-link"><img src="static/img/other/githubicon.png">V-1</a>
          </li>
          <li class="nav-item">
            <a href="https://github.com/sourashis59/chess-webapp" class="nav-link"><img src="static/img/other/githubicon.png" />V-2</a>
          </li>
          <li class="nav-item">
            <a href="https://www.linkedin.com/in/sourashis-mondal-6b90601a2/" class="nav-link"><img src="static\img\other\linkedinicon.png"/></a>
          </li>

        </ul>
      </div>
    </div>
  </nav>


  <section class="p-3">
    <div class="container">
      <div class="row">
        <div class="col-lg">

          <div class="card shadow-lg rounded">
            <div class="card-body">
              <div id="myBoard"></div>
              
              
              <img id="fire-explode" src="static/img/other/fireExplodeTransparent.gif" alt="Fire Explosion">

              <p class="card-text py-1 text-center"><span>FEN:</span> <span id="fen"></span></p>

            </div>

            <div class="text-center text-white" style="font-weight: bold; padding: 1rem;">
              <p>Status:<span class="lead" id="statusDiv" style="font-weight: bold;"></span></p>
            </div>

          </div>

        </div>

        <div class="col-lg" style="display: flex; flex-direction: column; align-items: flex-start; padding-top: 10px;">
          <div class="container" style="display:flex; flex-direction: column; justify-content: space-between;">
            <div class=" row py-1" role="group">
              <button type="button" class="col btn btn-outline-dark  btn-md m-1 " id="new-game-white-button"
                style="background-color: rgba(255, 255, 255, 0.5); color: black; border-radius: 10px;">
                <img class="img-fluid" src="static/img/chesspieces/wikipedia/wK.png" style="width: 25px;"><br />
                <strong>NEW GAME</strong><br />(As White)
              </button>

              <button type="button" class="col btn btn-outline-dark text-white  btn-md m-1" id="new-game-black-button"
                style="background-color: rgba(120, 116, 116, 0.5); border-radius: 10px;">
                <img class="img-fluid" src="static/img/chesspieces/wikipedia/bK.png" style="width: 25px;"><br />
                <strong>NEW GAME</strong><br />(As Black)
              </button>
            </div>

            <div class=" row py-1" role="group">
              <button type="button" class="col btn btn-outline-dark btn-md m-1" 
                data-bs-toggle="modal" data-bs-target="#drawModal"
                style="background-color: rgba(77, 255, 3, 0.5); color: black; border-radius: 10px;">
                Offer Draw 
              </button>

              <button type="button" class="col btn btn-outline-dark  btn-md m-1"  id="resign-button"
                data-bs-toggle="modal" data-bs-target="#resignModal"
                style="background-color: rgba(212, 25, 16, 0.5); color: white; border-radius: 10px;">
                <!-- <img class="img-fluid" src="static/img/other/resign.png" style="width: 30px;"> -->
                Resign! 
              </button>
            </div>



            <div class="card rounded row my-2">
              <div class="card-header" style="color:white;">
                Select engine search time: <br /> [Current Time:
                <span class="badge rounded-pill text-light lead" style="background-color:rgba(255,255,255,0.1);">
                  <span id="time-slider-value"></span>s
                </span>
                ]
              </div>
              <input class="card-body form-range" style="background-color:rgba(255, 255, 255, 0.1); border-radius: 10px;" min="1" max="30" value="2" step="1" type="range" id="time-slider"
                name="time-slider">
            </div>




            <div class="card row my-4 " style="height: 10rem; background-color: rgba(255,255,255, 0.1); border-radius: 10px;">
              <div style="color: white; padding: 1rem;">
                Engine Status:
              </div>

              <div class="card-body ">
                <div id="engine-status-text-div" style="color: white;">Best move</div>
              </div>

              <div style="padding: 1rem;">
                <div class="progress" style="height: 10px;">
                  <div id="engine-thinking-progress-bar" class="progress-bar progress-bar-striped bg-success"
                    role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"
                    style="width: 50%; transition: width 0s;"></div>
                </div>
              </div>


            </div>

            <div class="card row my-4" style="border-radius: 10px; background-color:rgba(255,255,255, 0.1);">
              <div style="color: white; padding: 1rem;">PGN:</div>
              <div class="card-body ">
                <span id="pgn" style="color:white;"></span>
              </div>
            </div>

          </div>


        </div>

      </div>
    </div>
  </section>








  <!-- Modals -->
  <div class="modal" id="drawModal" tabindex="-1" aria-labelledby="drawModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title" id="drawModalLabel">Draw Offer?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        
        <div class="modal-body">
          <h4>"Draw offer rejected."</h4>
<!--          <img class="img-fluid" src="static/img/other/drawOffer.png" width="400px">-->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Thanks!</button>
        </div>
      </div>
    </div>
  </div>


  <div class="modal" id="resignModal" tabindex="-1" aria-labelledby="resignModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title" id="resignModalLabel">Thanks for resigning!</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Welcome</button>
        </div>
      </div>
    </div>
  </div>



  <!-- Audio -->
  <audio id="piece-move-audio" src="static/audio/pieceMoveSound.mp3"></audio>
  <audio id="fire-explode-audio" src="static/audio/fireExplodeAudio.mp3"></audio>
  

  <!-- for bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>

  <script src="static/js/lib/chessboardjs/chessboard-1.0.0.js"></script>
  <script src="static/js/lib/chessjs/chess.js"></script>
  <script src="static/js/ui-script/uiscript.js"></script>
</body>

</html>
